search:
  country: de
  always_queries:
  - wind turbine loads engineer
  - wind energy engineer
  - mechanical engineer
  - mechanical design engineer
  - CAE engineer mechanical
  - FEA engineer mechanical
  - structural analysis engineer
  - structural dynamics engineer
  - mechanical simulation engineer
  - validation engineer mechanical
  - test engineer mechanical
  - product development engineer mechanical
  - renewable energy project engineer
  - Berechnungsingenieur Maschinenbau
  - Berechnungsingenieur FEM
  - Simulationsingenieur Maschinenbau
  - Entwicklungsingenieur Maschinenbau
  - Konstruktionsingenieur Maschinenbau
  - Projektingenieur Windenergie
  - Werkstudent Maschinenbau
  - Werkstudent Windenergie
  - Werkstudent CAE
  - Praktikum Maschinenbau
  - Masterarbeit Windenergie Simulation
  broader_queries: []
  career_scope_file: input/career_scope.yaml
  use_career_scope: true
  include_tiers:
  - core
  - adjacent
  - stretch
  auto_from_profile: true
  auto_from_cv: false
  broad_search: true
  max_auto_queries: 18
  max_queries_per_cycle: 30
  query_rotation_state: output/query_rotation.json
  search_plan_output: output/search_plan.json
  job_languages:
  - en
  - de
  locations:
  - Germany
  fresh_days: 7
  full_eligibility_days: 14
  active_grace_days: 30
  strong_title_max_days: 45
  max_age_days: 30
  results_per_source: 25
  verify_live_page: true
http:
  min_delay_per_host_seconds: 1.5
  delay_jitter_seconds: 0.25
  max_retries: 2
  retry_backoff_seconds: 2.0
  max_retry_after_seconds: 60
  timeout_seconds: 20
  page_cache_minutes: 360
  cache_file: output/http_cache.json
  respect_robots_txt: true
  robots_fail_open: true
  robots_cache_hours: 12
  max_cached_body_chars: 750000
  robots_user_agent: JobSearchAgent
  detail_enrichment:
    max_network_detail_checks_per_run: 45
    hard_max_with_strong_titles: 60
    skip_fresh_if_description_chars_at_least: 500
preferences:
  required_title_keywords: []
  excluded_title_keywords:
  - senior director
  - principal manager
  - head of
  - chief engineer
  allowed_employment_types:
  - professional
  - full_time
  - part_time
  - fixed_term
  - master_thesis
  - internship
  - working_student
  - unknown
  preferred_keywords:
  - ansys
  - abaqus
  - fea
  - fem
  - cae
  - structural
  - vibration
  - dynamics
  - simulation
  - mechanical
  - product development
  - wind
  - renewable
  - python
  - matlab
  - simulink
  - solidworks
  - catia
  - development
  - design
  - manufacturing
  - automation
  - project engineer
  preferred_locations:
  - germany
  - remote
  minimum_match_score: 63
  package_generation_score: 77
  do_not_penalize_title_mismatch_alone: true
  german_language_policy:
    current_level: B1
    do_not_hard_filter_language_mismatch: true
    flag_b2_or_higher: true
ai:
  enabled: true
  provider: codex_cli
  model: ${OPENAI_MODEL:-gpt-5.6}
  codex_model: ''
  codex_path: ''
  timeout_seconds: 300
  fallback_to_heuristic: true
  tiered:
    enabled: false
    screen_min_pre_score: 42
    deep_min_screen_score: 58
    deep_force_pre_score: 72
    max_screen_per_run: 20
    max_deep_per_run: 10
    screen_evidence_limit: 8
    deep_evidence_limit: 16
    manual_force_screen: true
  budget:
    enabled: true
    # Provider calls are deliberately scarce. The official Codex meter is the source
    # of truth; these are conservative LOCAL ceilings that fail closed before a call.
    max_calls_per_run: 4
    max_estimated_input_tokens_per_run: 35000
    max_failed_calls_per_run: 1
    max_provider_calls_per_day: 4
    max_provider_calls_per_allowance_period: 12
    max_estimated_input_tokens_per_day: 35000
    max_estimated_input_tokens_per_allowance_period: 90000
    pause_below_remaining_percent: 10
    usage_hint_file: input/codex_usage_hint.json
    ledger_file: ~/.job_search_agent/codex_budget_ledger.jsonl
    ledger_fail_closed: true
    manual_pause: false
  strategy:
    mode: local_rank_then_deep
    max_new_deep_per_run: 2
    deep_min_pre_score: 63
    deep_min_local_priority: 68
    skip_deep_if_german_c1_gap: true
    deep_evidence_limit: 14
    reserve_calls_for_new_packages: 2
    max_new_packages_per_run: 2
    max_repair_packages_per_run: 2
    reuse_completed_deep: true
    reuse_legacy_deep: true
    refresh_if_job_description_changed: true
sources:
  arbeitsagentur:
    enabled: true
    max_queries_per_run: 14
    anchor_queries_per_run: 8
    timeout_seconds: 25
    min_delay_seconds: 1.5
    delay_jitter_seconds: 0.25
    respect_robots_txt: true
    robots_fail_open: true
    user_agent: JobSearchAgent/1.9.0
    results_per_query: 8
  arbeitnow:
    enabled: true
    pages: 3
    max_results_per_run: 120
    timeout_seconds: 25
    results_per_query: 25
  adzuna:
    enabled: true
    max_queries_per_run: 16
    anchor_queries_per_run: 8
  jooble:
    enabled: true
    max_queries_per_run: 16
    anchor_queries_per_run: 8
  greenhouse:
    enabled: true
    boards: []
  lever:
    enabled: true
    sites: []
  smartrecruiters:
    enabled: true
    companies: []
    max_queries_per_run: 14
    anchor_queries_per_run: 8
  manual_links:
    enabled: true
    file: input/manual_jobs.txt
    bypass_age_filter: true
  email_alert_files:
    enabled: true
    directory: input/job_alerts
